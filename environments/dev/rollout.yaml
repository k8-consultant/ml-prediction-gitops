apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: ml-prediction-api

spec:
  replicas: 5

  selector:
    matchLabels:
      app: ml-prediction-api

  template:
    metadata:
      labels:
        app: ml-prediction-api

      annotations:
         prometheus.io/scrape: "true"
         prometheus.io/path: "/metrics"
         prometheus.io/port: "8000"
        

    spec:
      containers:
        - name: ml-prediction-api

          image: ghcr.io/k8-consultant/ml-prediction-api:44eb48c184e35ba7018d4f474c277753ccfe2a96

          ports:
            - containerPort: 8000

          env:
            - name: APP_VERSION
              value: "v2"

            - name: MODEL_VERSION
              value: "model-v1"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

  strategy:
    canary:

      steps:

        - setWeight: 20
        - pause:
            duration: 10s 
        - analysis:
             templates: 
                - templateName: ml-api-success-rate
            
        - setWeight: 40
        - pause:
            duration: 60s
        - analysis: 
             templates: 
                - templateName: ml-api-success-rate

        - setWeight: 60
        - pause:
            duration: 70s  

        - analysis: 
             templates: 
                - templateName: ml-api-success-rate

        - setWeight: 100
